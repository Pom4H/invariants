name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run check
      - run: bun run build
      - name: Git consumer smoke test
        run: |
          mkdir -p /tmp/invariants-consumer
          cat > /tmp/invariants-consumer/package.json <<EOF
          {
            "name": "invariants-consumer",
            "private": true,
            "dependencies": {
              "@pom4h/invariants": "github:Pom4H/invariants#${GITHUB_SHA}"
            }
          }
          EOF
          cd /tmp/invariants-consumer
          bun install
          echo "--- invariants lock entry ---"
          grep -n -B 2 -A 3 '@pom4h/invariants' bun.lock || true
          bun -e 'import { entity } from "@pom4h/invariants"; const x = entity("app", "api"); if (x.id !== "api") process.exit(1)'
